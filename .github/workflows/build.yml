name: Test and build
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: stable
          cache: false
      - run: go vet ./...
      - run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: stable
          cache: false
      - name: Build standalone executables
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/gpuglint-linux-$arch" .
            GOOS=windows GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/gpuglint-windows-$arch.exe" .
          done
          cd dist
          sha256sum gpuglint-* > SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gpuglint-binaries
          path: dist/

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: gpuglint-binaries
          path: dist/
      - name: Verify release checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "GPU Glint $GITHUB_REF_NAME" --generate-notes \
            dist/gpuglint-* dist/SHA256SUMS
